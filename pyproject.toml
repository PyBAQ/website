[project]
name = "pybaq-website"
version = "0.1.0"
description = "Python Barranquilla website"
readme = "README.md"

requires-python = ">=3.12"

dependencies = [
  "lektor~=3.4.0b13",
  "lektor-disqus-comments~=0.4.1",
  "lektor-markdown-highlighter~=0.3.2",
  "lektor-markdown-header-anchors~=0.4.0",
  "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    "online-w3c-validator>=0.3.21",
    "pylint>=4.0.6",
    "pytest>=9.1.1",
    "pytest-base-url>=2.1.0",
    "requests>=2.34.2",
    "screenpy>=5.0.0",
    "screenpy-selenium>=4.0.4",
    "selenium>=4.46.0",
]

[tool.uv]
managed = true
