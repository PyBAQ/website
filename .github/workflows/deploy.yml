name: "Desplegar pagina"

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "master"
  workflow_dispatch:
    # Allow manually running workflow
  # schedule:
    # - cron: "23 2 * * *"

env:
  DEPLOY: >-
    ${{
    github.event_name != 'pull_request'
    &&
    github.ref == 'refs/heads/master'
    }}
  OUTPUT: _html
  TZ: America/Bogota

jobs:
  build:
    name: Construir sitio web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - uses: astral-sh/setup-uv@v7
      - name: Instalar dependencias
        run: uv sync

      - name: Verificar Pylint
        run: uv run pylint --recursive=y tests scripts

      - name: Construir pagina pybaq
        run: uv run lektor build -O '${{ env.OUTPUT }}'

      - name: Desplegar pagina pybaq
        if: env.DEPLOY == 'true'
        run: uv run lektor deploy -O '${{ env.OUTPUT }}' ghpages-https
        env:
          LEKTOR_DEPLOY_USERNAME: pybaq
          LEKTOR_DEPLOY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
